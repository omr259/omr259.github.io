<title>كل مواقعي في مكان واحد</title>
<style>
:root { --ds-page: transparent; }
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",Arial,sans-serif;font-size:15px;line-height:1.6;color:#fff}
.app{max-width:1040px;margin:0 auto;padding:24px}
h1{font-weight:400;font-size:30px;line-height:1.3;margin:16px 0 8px}
.fact{color:rgba(255,255,255,.78);margin:0 0 20px}
.intro{margin:0 0 28px}
.label{color:rgba(255,255,255,.78);margin:0 0 12px}
.note{border-inline-start:3px solid rgba(255,255,255,.3);padding:4px 16px;margin:32px 0}
.note b{display:block;margin-bottom:4px}
.closing{color:rgba(255,255,255,.78);margin:32px 0 8px}
.hub-group{display:flex;flex-direction:column}
.hub-group+.hub-group,.note+.hub-group{margin-top:28px}
html, body, #root { margin: 0; min-height: 100%; }
body { background: var(--ds-page); }
.file-nav { display: flex; flex-wrap: wrap; gap: 20px; border-bottom: 1px solid var(--ds-hairline); }
.file-nav a { padding: 10px 0; color: var(--ds-ink-2); text-decoration: none; }
.file-nav a[aria-current="page"] { color: var(--ds-ink); box-shadow: inset 0 -1px 0 var(--ds-ink); }
@media (max-width: 600px) { .file-nav a { display: inline-flex; align-items: center; min-height: 44px; } }
html, body { min-height: 100%; }
:root { --ds-page: transparent; --ds-ink: #ffffff; --ds-ink-2: rgba(255,255,255,.78); --ds-hairline: rgba(255,255,255,.18); --ds-raised: rgba(255,255,255,.12); }
body { background: radial-gradient(circle at 85% 0%, #14b8a6 0, transparent 45%), radial-gradient(circle at 0% 100%, #f59e0b 0, transparent 45%), linear-gradient(160deg, #04201f, #0b3b3a 55%, #134e4a); background-attachment: fixed; background-color: #04201f; }
@keyframes hub-pop { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
.hub-card { animation: hub-pop .45s ease-out both; transition: transform .15s ease, box-shadow .15s ease; -webkit-tap-highlight-color: transparent; }
.hub-card:nth-child(2) { animation-delay: .08s; } .hub-card:nth-child(3) { animation-delay: .16s; }
.hub-card.is-live:active { transform: scale(.94); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.hub-back:active { transform: scale(.94); }
@media (prefers-reduced-motion: reduce) { .hub-card { animation: none; } }
.hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hub-card { display: flex; flex-direction: column; gap: 4px; min-height: 160px; padding: 16px; border: 0; border-radius: 20px; color: #fff; text-decoration: none; background: var(--c); box-sizing: border-box; text-align: start; font: inherit; cursor: pointer; box-shadow: 0 6px 14px rgba(0,0,0,.14); }
.hub-icon { font-size: 34px; line-height: 44px; }
.hub-name { font-weight: 600; font-size: 17px; }
.hub-desc { opacity: .92; }
.hub-go { margin-top: auto; padding-top: 8px; font-weight: 600; }
.hub-card.is-soon { background: rgba(255,255,255,.1); color: rgba(255,255,255,.7); box-shadow: none; border: 2px dashed rgba(255,255,255,.35); cursor: default; }
.hub-card.is-soon .hub-icon { filter: grayscale(1); opacity: .6; }
.hub-back { align-self: flex-start; width: fit-content; display: inline-flex; align-items: center; min-height: 44px; margin-bottom: 8px; padding: 0 16px; border: 0; border-radius: 22px; background: #fff; color: #1e1b4b; font: inherit; font-weight: 600; cursor: pointer; }
@media (min-width: 768px) { .hub-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 340px) { .hub-grid { grid-template-columns: 1fr; } }

.hub-by { margin: 0 0 4px; color: rgba(255,255,255,.85); font-size: 13px; }
.hub-contact { display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 16px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); }
.hub-contact a { color: #fff; font-weight: 600; font-size: 18px; text-decoration: none; direction: ltr; text-align: start; }
.hub-wide{grid-column:1/-1;min-height:110px!important;flex-direction:row!important;align-items:center;gap:14px!important;background:linear-gradient(120deg,#0a0a0a 0%,#7f1313 45%,#e11d2e 100%)!important;border:2px solid rgba(255,255,255,.85)!important;box-shadow:0 8px 24px rgba(225,29,46,.35)!important}
.hub-wide .hub-icon{font-size:40px}
.hub-wt{display:flex;flex-direction:column;gap:2px;text-align:start}
.hub-wname{font-family:"Lalezar","Cairo",sans-serif;font-size:27px;line-height:1.25;color:#fff;letter-spacing:.3px;text-shadow:0 2px 0 #000}
.hub-wdesc{font-size:14px;color:#ffe4e6}
.hub-wgo{font-size:14px;font-weight:700;color:#fff}

.hub-head{position:relative;min-height:132px;padding-left:170px;display:flex;align-items:flex-start}
.hub-brand{min-width:0}
.hub-logo-img{position:absolute;left:0;top:-4px;width:156px;height:132px;object-fit:contain;object-position:left center}
.hub-brand .hub-by{margin:0 0 4px}
.hub-brand h1{margin:0 0 8px}
.hub-contact{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);margin-top:30px}
.hub-contact-title{font-size:19px;font-weight:700;margin-bottom:12px}
.hub-contact-links{display:flex;gap:12px;flex-wrap:wrap}
.hub-contact-link{flex:1 1 150px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;text-decoration:none;font-weight:600}
.hub-contact-link svg{width:38px;height:38px;fill:currentColor}
@media(max-width:420px){.hub-head{padding-left:104px;min-height:82px}.hub-logo-img{width:94px;height:82px;top:0}.hub-contact-links{gap:8px}.hub-contact-link{min-height:96px}}
</style>
