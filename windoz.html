<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Desktop</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,Arial,sans-serif;background:#0b1d3a}
#desk{position:fixed;inset:0 0 44px 0;background:radial-gradient(circle at 30% 20%,#2b6cd4,#10285a 60%,#071225);}
.icons{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;flex-wrap:wrap;height:calc(100% - 20px);gap:6px;align-content:flex-start}
.icon{width:78px;padding:8px 4px;text-align:center;color:#fff;font-size:12px;border-radius:8px;user-select:none;cursor:pointer}
.icon:active,.icon:hover{background:rgba(255,255,255,.18)}
.icon b{display:block;font-size:34px;font-weight:400;margin-bottom:2px}
.win{position:absolute;background:#fff;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;min-width:220px;min-height:140px;border:1px solid #345}
.win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0}
.tb{background:#1f3b73;color:#fff;display:flex;align-items:center;padding:0 6px;height:36px;gap:6px;user-select:none;touch-action:none;cursor:move;flex:none}
.tb .t{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb button{width:32px;height:28px;border:0;border-radius:5px;background:rgba(255,255,255,.15);color:#fff;font-size:15px;cursor:pointer}
.tb button.x:hover,.tb button.x:active{background:#e03c3c}
.body{flex:1;position:relative;background:#fff;min-height:0}
.body iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.rs{position:absolute;left:0;bottom:0;width:22px;height:22px;cursor:nesw-resize;touch-action:none;background:linear-gradient(45deg,transparent 50%,#789 50%);opacity:.6}
.win.max .rs{display:none}
#bar{position:fixed;left:0;right:0;bottom:0;height:44px;background:#0a1630;display:flex;align-items:center;gap:6px;padding:0 6px;border-top:1px solid #2a4}
#tasks{flex:1;display:flex;gap:5px;overflow-x:auto}
.task{padding:6px 10px;background:#1d3566;color:#fff;border-radius:5px;font-size:12px;white-space:nowrap;cursor:pointer}
.task.on{background:#3b6fd6}
#clock{color:#fff;font-size:13px;padding:0 6px}
#start{background:#3b6fd6;color:#fff;border:0;border-radius:5px;height:32px;padding:0 12px;font-size:14px}
#menu{position:fixed;bottom:48px;right:6px;background:#12244a;border-radius:8px;padding:6px;display:none;min-width:170px;z-index:99999}
#menu div{color:#fff;padding:9px 10px;border-radius:5px;font-size:14px;cursor:pointer}
#menu div:active,#menu div:hover{background:#2a4a8e}
.pad{padding:10px;font-size:14px;direction:rtl}
textarea{width:100%;height:100%;border:0;padding:10px;font-size:15px;resize:none;outline:0}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;height:100%;direction:ltr}
.calc input{grid-column:1/5;font-size:22px;text-align:right;padding:6px}
.calc button{font-size:18px;border:0;background:#e5ebf7;border-radius:6px}
.urlbar{display:flex;gap:4px;padding:4px;background:#eef;direction:ltr;flex:none}
.urlbar input{flex:1;padding:5px;font-size:14px;min-width:0}
#lock{position:fixed;inset:0;z-index:999999;background:radial-gradient(circle at 50% 30%,#1b3a73,#050b18);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff}#lock input{padding:12px;font-size:18px;border-radius:8px;border:0;text-align:center;width:220px}#lock button{padding:10px 30px;font-size:16px;border:0;border-radius:8px;background:#3b6fd6;color:#fff}#lock p{margin:0;color:#f77;min-height:20px;font-size:14px}
</style></head><body>
<div id="lock"><div style="font-size:50px">🔒</div><h2 style="margin:0">windoz omar</h2><input id="pw" type="password" placeholder="الباسورد" autocomplete="off"><button id="pwb">دخول</button><p id="pwe"></p></div>
<div id="desk"><div class="icons" id="icons"></div></div>
<div id="menu"></div>
<div id="bar"><button id="start">☰ ابدأ</button><div id="tasks"></div><div id="clock"></div></div>
<script>
/* ===== غيّر الباسورد من هنا ===== */
const PASSWORD='9802';
/* ================================= */
(function(){const L=document.getElementById('lock');
 if(sessionStorage.getItem('wo_ok')=='1'){L.remove();return}
 const go=()=>{if(document.getElementById('pw').value===PASSWORD){sessionStorage.setItem('wo_ok','1');L.remove()}else{document.getElementById('pwe').textContent='باسورد غلط';document.getElementById('pw').value=''}};
 document.getElementById('pwb').onclick=go;document.getElementById('pw').onkeydown=e=>{if(e.key=='Enter')go()};})();
/* ===== عدّل هنا: التطبيقات ===== */
const APPS=[
 {id:'site',ic:'🌐',name:'موقعي',type:'url',url:'https://omr259.github.io/',w:520,h:420},
 {id:'browser',ic:'🧭',name:'متصفح',type:'browser'},
 {id:'notes',ic:'📝',name:'ملاحظات',type:'notes'},
 {id:'calc',ic:'🧮',name:'آلة حاسبة',type:'calc'},
 {id:'about',ic:'ℹ️',name:'عن النظام',type:'html',html:'<div class="pad"><h3>سطح مكتب تجريبي</h3><p>اسحب النافذة من العنوان، كبّرها بزر ▢، صغّرها بزر ─، أو اسحب الزاوية لتغيير الحجم.</p></div>'}
];
/* ================================ */
const desk=document.getElementById('desk'),tasks=document.getElementById('tasks');
let z=10,wins={},n=0;
const ic=document.getElementById('icons'),menu=document.getElementById('menu');
APPS.forEach(a=>{
 const d=document.createElement('div');d.className='icon';d.innerHTML='<b>'+a.ic+'</b>'+a.name;
 let last=0;d.onclick=()=>{open(a)};ic.appendChild(d);
 const m=document.createElement('div');m.textContent=a.ic+' '+a.name;m.onclick=()=>{open(a);menu.style.display='none'};menu.appendChild(m);
});
document.getElementById('start').onclick=e=>{e.stopPropagation();menu.style.display=menu.style.display=='block'?'none':'block'};
document.addEventListener('pointerdown',e=>{if(!menu.contains(e.target)&&e.target.id!='start')menu.style.display='none'});
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,10000);

function content(a,body){
 if(a.type=='url'){body.innerHTML='<iframe src="'+a.url+'"></iframe>'}
 else if(a.type=='html'){body.innerHTML=a.html}
 else if(a.type=='notes'){const t=document.createElement('textarea');t.placeholder='اكتب هنا...';t.value=localStorage.getItem('notes')||'';t.oninput=()=>localStorage.setItem('notes',t.value);body.appendChild(t)}
 else if(a.type=='calc'){
  body.innerHTML='<div class="calc"><input readonly value="0"></div>';const g=body.firstChild,o=g.firstChild;let s='';
  'C ( ) / 7 8 9 * 4 5 6 - 1 2 3 + 0 . ⌫ ='.split(' ').forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{
   if(k=='C')s='';else if(k=='⌫')s=s.slice(0,-1);else if(k=='='){try{s=String(Function('"use strict";return ('+s+')')())}catch(e){s=''}}else s+=k;o.value=s||'0'};g.appendChild(b)});
 }
 else if(a.type=='browser'){
  body.innerHTML='<div class="urlbar"><input value="https://wikipedia.org"><button>Go</button></div><div style="position:absolute;inset:40px 0 0 0"><iframe></iframe></div>';
  const i=body.querySelector('input'),f=body.querySelector('iframe'),go=()=>{let u=i.value.trim();if(!/^https?:/.test(u))u='https://'+u;f.src=u};
  body.querySelector('button').onclick=go;i.onkeydown=e=>{if(e.key=='Enter')go()};
  const p=document.createElement('div');p.className='pad';p.style.cssText='position:absolute;bottom:6px;left:6px;right:6px;font-size:11px;color:#777;background:#fffd;pointer-events:none';p.textContent='بعض المواقع (زي BBC) بتمنع الفتح هنا. دي حماية من الموقع نفسه.';body.appendChild(p);
 }
}
function open(a){
 if(wins[a.id]&&a.single!==false){show(wins[a.id]);return}
 const w=document.createElement('div');w.className='win';
 const W=Math.min(a.w||420,innerWidth-20),H=Math.min(a.h||340,innerHeight-80);
 w.style.cssText='width:'+W+'px;height:'+H+'px;left:'+Math.max(0,Math.min(innerWidth-W,10+n%5*28))+'px;top:'+(10+n%5*28)+'px';n++;
 w.innerHTML='<div class="tb"><span class="t">'+a.ic+' '+a.name+'</span><button class="m">─</button><button class="M">▢</button><button class="x">✕</button></div><div class="body"></div><div class="rs"></div>';
 const body=w.querySelector('.body');content(a,body);desk.appendChild(w);
 const task=document.createElement('div');task.className='task';task.textContent=a.ic+' '+a.name;tasks.appendChild(task);
 const o={w,task,a};wins[a.id]=o;
 w.addEventListener('pointerdown',()=>focus(o));
 task.onclick=()=>{if(w.style.display=='none'||!task.classList.contains('on'))show(o);else{w.style.display='none';task.classList.remove('on')}};
 w.querySelector('.m').onclick=()=>{w.style.display='none';task.classList.remove('on')};
 w.querySelector('.M').onclick=()=>w.classList.toggle('max');
 w.querySelector('.x').onclick=()=>{w.remove();task.remove();delete wins[a.id]};
 w.querySelector('.tb').ondblclick=()=>w.classList.toggle('max');
 drag(w,w.querySelector('.tb'),false);drag(w,w.querySelector('.rs'),true);
 focus(o);
}
function show(o){o.w.style.display='flex';focus(o)}
function focus(o){o.w.style.zIndex=++z;Object.values(wins).forEach(x=>x.task.classList.remove('on'));o.task.classList.add('on')}
function drag(w,h,resize){
 h.addEventListener('pointerdown',e=>{
  if(e.target.tagName=='BUTTON'||w.classList.contains('max'))return;
  e.preventDefault();h.setPointerCapture(e.pointerId);
  const sx=e.clientX,sy=e.clientY,L=w.offsetLeft,T=w.offsetTop,W=w.offsetWidth,H=w.offsetHeight;
  w.querySelectorAll('iframe').forEach(f=>f.style.pointerEvents='none');
  const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;
   if(resize){w.style.width=Math.max(220,W-dx)+'px';w.style.left=Math.min(L+W-220,L+dx)+'px';w.style.height=Math.max(140,H+dy)+'px'}
   else{w.style.left=Math.max(-W+60,Math.min(innerWidth-60,L+dx))+'px';w.style.top=Math.max(0,Math.min(desk.offsetHeight-36,T+dy))+'px'}};
  const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);w.querySelectorAll('iframe').forEach(f=>f.style.pointerEvents='')};
  h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);
 });
}
</script></body></html>
